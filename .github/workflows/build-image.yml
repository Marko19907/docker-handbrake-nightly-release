name: Build HDR image

on:
  push:
    branches:
      - svt-av1-hdr
  workflow_dispatch:

concurrency:
  group: handbrake-hdr
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOCKER_IMAGE_NAME: marko19907/handbrake-nightly-release

jobs:
  build:
    if: github.ref == 'refs/heads/svt-av1-hdr'
    runs-on: ubuntu-22.04
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v2
        with:
          preinstalled-runtimes: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare tags
        id: prep
        run: |
          VERSION="hdr-${GITHUB_SHA::8}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tags=${DOCKER_IMAGE_NAME}:${VERSION},${DOCKER_IMAGE_NAME}:hdr" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: linux/amd64
          provenance: false
          tags: ${{ steps.prep.outputs.tags }}
          build-args: |
            DOCKER_IMAGE_VERSION=${{ steps.prep.outputs.version }}
          cache-from: |
            type=gha,scope=handbrake-hdr
            type=registry,ref=ghcr.io/uranite/handbrake-svt-av1-hdr:buildcache
          cache-to: type=gha,mode=max,scope=handbrake-hdr

      - name: Check HandBrake starts
        env:
          IMAGE: ${{ env.DOCKER_IMAGE_NAME }}:${{ steps.prep.outputs.version }}
        run: |
          docker run --rm --entrypoint /usr/bin/HandBrakeCLI "$IMAGE" --version
          docker run -d --name handbrake-check -e AUTOMATED_CONVERSION=0 "$IMAGE"
          trap 'docker logs handbrake-check; docker rm -f handbrake-check' EXIT
          for attempt in $(seq 1 30); do
            if docker exec handbrake-check pidof ghb; then
              sleep 10
              docker exec handbrake-check pidof ghb
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' handbrake-check)" != true ]; then
              exit 1
            fi
            sleep 2
          done
          exit 1

      - name: Publish image
        env:
          VERSION: ${{ steps.prep.outputs.version }}
        run: |
          docker push "${DOCKER_IMAGE_NAME}:${VERSION}"
          docker push "${DOCKER_IMAGE_NAME}:hdr"
